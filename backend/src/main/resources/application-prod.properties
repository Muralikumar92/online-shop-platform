# In prod, mail is sent via SesEmailService (AWS SES SDK), not JavaMailSender/SMTP.
# Spring Boot still auto-configures a JavaMailSender bean and its actuator health
# check, which would otherwise try to connect to spring.mail.host (SMTP) and fail,
# dragging /actuator/health to DOWN even though the app is healthy.
management.health.mail.enabled=false
