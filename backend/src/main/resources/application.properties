spring.application.name=backend

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:shopplatform}
spring.datasource.username=${DB_USER:shopplatform}
spring.datasource.password=${DB_PASSWORD:shopplatform}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

# Comma-separated root domains whose first label is treated as a tenant slug,
# e.g. myshops.com -> acme.myshops.com resolves to shop "acme".
app.tenant.root-domain=${APP_ROOT_DOMAIN:myshops.com}

app.jwt.secret=${JWT_SECRET:change-me-in-prod-change-me-in-prod-32b}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
app.mail.from=${MAIL_FROM:no-reply@myshops.com}
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:3000}

app.aws.s3.bucket=${AWS_S3_BUCKET:}
app.aws.s3.public-base-url=${AWS_S3_PUBLIC_BASE_URL:}
app.aws.region=${AWS_REGION:ap-south-1}
# SES isn't available in every region; defaults to the same region as S3 but
# can be overridden independently (e.g. deploy S3 media in ap-south-1 while
# sending mail via SES in a region where it's supported/further along).
app.aws.ses.region=${AWS_SES_REGION:${AWS_REGION:ap-south-1}}

app.razorpay.key-id=${RAZORPAY_KEY_ID:rzp_test_placeholder}
app.razorpay.key-secret=${RAZORPAY_KEY_SECRET:placeholder_secret}

spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=50MB

management.endpoints.web.exposure.include=health,info
