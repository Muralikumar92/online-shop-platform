services:
  backend:
    image: ${ECR_REGISTRY}/shopplatform-backend:${IMAGE_TAG:-latest}
    container_name: shopplatform-backend
    restart: unless-stopped
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-shopplatform}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      APP_ROOT_DOMAIN: ${APP_ROOT_DOMAIN}
      JWT_SECRET: ${JWT_SECRET}
      # Mail goes via AWS SES in prod (see SPRING_PROFILES_ACTIVE below), not
      # SMTP - no MAIL_HOST/PORT/credentials needed here. The EC2 instance's
      # IAM role needs ses:SendEmail; MAIL_FROM must be a verified SES
      # identity in AWS_SES_REGION - see DEPLOYMENT.md.
      SPRING_PROFILES_ACTIVE: prod
      MAIL_FROM: ${MAIL_FROM}
      AWS_SES_REGION: ${AWS_SES_REGION:-ap-south-1}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      AWS_S3_PUBLIC_BASE_URL: ${AWS_S3_PUBLIC_BASE_URL}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
    expose:
      - "8080"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    image: ${ECR_REGISTRY}/shopplatform-frontend:${IMAGE_TAG:-latest}
    container_name: shopplatform-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    expose:
      - "3000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:1.27-alpine
    container_name: shopplatform-nginx
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot-etc:/etc/letsencrypt:ro

volumes:
  certbot-etc:

  # Wildcard certs (*.myshops.com) require the DNS-01 challenge, which needs
  # Route53 access rather than a plain HTTP webroot challenge (one cert per
  # subdomain would not scale to "any shop owner can subscribe"). Credentials
  # come from an IAM role attached to the EC2 instance - see DEPLOYMENT.md.
  certbot:
    image: certbot/dns-route53
    container_name: shopplatform-certbot
    volumes:
      - certbot-etc:/etc/letsencrypt
    entrypoint: >
      sh -c "trap exit TERM; while :; do certbot renew --dns-route53; sleep 12h; done"

volumes:
  certbot-etc:
