services:
  # Beta/low-cost setup: Postgres runs in a container on the same EC2 box
  # instead of RDS (no managed backups/failover - fine for a small beta,
  # revisit RDS once there's real traffic/revenue to justify ~$13/mo more).
  postgres:
    image: postgres:16-alpine
    container_name: shopplatform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-shopplatform}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    image: ${ECR_REGISTRY}/shopplatform-backend:${IMAGE_TAG:-latest}
    container_name: shopplatform-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-shopplatform}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      APP_ROOT_DOMAIN: ${APP_ROOT_DOMAIN}
      JWT_SECRET: ${JWT_SECRET}
      # Mail goes via AWS SES in prod (see SPRING_PROFILES_ACTIVE below), not
      # SMTP - no MAIL_HOST/PORT/credentials needed here. The EC2 instance's
      # IAM role needs ses:SendEmail; MAIL_FROM must be a verified SES
      # identity in AWS_SES_REGION - see DEPLOYMENT.md.
      SPRING_PROFILES_ACTIVE: prod
      MAIL_FROM: ${MAIL_FROM}
      AWS_SES_REGION: ${AWS_SES_REGION:-ap-south-1}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      AWS_S3_PUBLIC_BASE_URL: ${AWS_S3_PUBLIC_BASE_URL}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
    expose:
      - "8080"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    image: ${ECR_REGISTRY}/shopplatform-frontend:${IMAGE_TAG:-latest}
    container_name: shopplatform-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
      BACKEND_INTERNAL_URL: http://backend:8080
    expose:
      - "3000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:1.27-alpine
    container_name: shopplatform-nginx
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # No certbot/TLS service for the beta - no domain is registered yet, so
  # access is plain HTTP over the Elastic IP. Once a domain + Route53 zone
  # exist, reintroduce a certbot service (DNS-01 via Route53, as previously
  # planned) and switch nginx to terminate HTTPS - see DEPLOYMENT.md.

volumes:
  postgres-data:
