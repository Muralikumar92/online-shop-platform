worker_processes auto;

events {
    worker_connections 1024;
}

http {
    sendfile on;
    client_max_body_size 50m;

    # theatti.com is live (Route53 zone + wildcard A record to this EIP) - plain
    # HTTP now just redirects to HTTPS. The nip.io/raw-IP host still answers
    # here too (default_server) so the old beta URL keeps working over HTTP
    # during the transition, since it has no TLS cert of its own.
    server {
        listen 80 default_server;
        server_name _;

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl default_server;
        server_name theatti.com *.theatti.com;

        ssl_certificate /etc/letsencrypt/live/theatti.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/theatti.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        location /api/ {
            proxy_pass http://backend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /actuator/health {
            proxy_pass http://backend:8080;
            proxy_set_header Host $host;
        }

        # Everything else -> the Next.js storefront/owner-console frontend.
        location / {
            proxy_pass http://frontend:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
