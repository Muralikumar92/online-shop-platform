worker_processes auto;

events {
    worker_connections 1024;
}

http {
    sendfile on;
    client_max_body_size 50m;

    # Beta: no domain registered yet, so this listens on plain HTTP over the
    # EC2 Elastic IP (or a nip.io hostname pointing at it) and serves a single
    # shop - TenantResolutionFilter in the backend still resolves the tenant
    # from the Host header, so no code changes are needed when a real domain
    # + wildcard subdomains are added later (see DEPLOYMENT.md).
    server {
        listen 80 default_server;
        server_name _;

        location /api/ {
            proxy_pass http://backend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /actuator/health {
            proxy_pass http://backend:8080;
            proxy_set_header Host $host;
        }

        # Everything else -> the Next.js storefront/owner-console frontend.
        location / {
            proxy_pass http://frontend:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
