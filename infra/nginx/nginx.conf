worker_processes auto;

events {
    worker_connections 1024;
}

http {
    sendfile on;
    client_max_body_size 50m;

    # Every shop's subdomain (acme.myshops.com, janes-boutique.myshops.com, ...)
    # terminates here and is forwarded with its original Host header intact -
    # TenantResolutionFilter in the backend does the actual tenant lookup from
    # that header, so nginx itself stays tenant-agnostic.

    server {
        listen 80;
        server_name myshops.com *.myshops.com;
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name myshops.com *.myshops.com;

        ssl_certificate     /etc/letsencrypt/live/myshops.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/myshops.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        # Backend API (also serves subdomain-scoped /api/public/** storefront
        # endpoints used directly by the frontend at request time).
        location /api/ {
            proxy_pass http://backend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /actuator/health {
            proxy_pass http://backend:8080;
            proxy_set_header Host $host;
        }

        # Everything else -> the Next.js storefront/owner-console frontend.
        location / {
            proxy_pass http://frontend:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
